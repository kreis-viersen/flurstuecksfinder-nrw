name: Quality and Security

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Flake8, Bandit and detect-secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install checks
        run: python -m pip install --upgrade flake8 bandit detect-secrets

      - name: Flake8
        continue-on-error: true
        run: flake8 . --max-line-length=120

      - name: Bandit
        run: bandit -r . -ll

      - name: detect-secrets
        shell: bash
        run: |
          detect-secrets scan \
            --all-files \
            --exclude-files '(^|/)\.git/' \
            --exclude-files '(^|/)metadata\.txt$' \
            --exclude-files '(^|/)\.secrets\.baseline$' \
            > /tmp/secrets.json

          python - <<'PY'
          import json
          import sys

          with open("/tmp/secrets.json", encoding="utf-8") as f:
              results = json.load(f).get("results", {})

          if results:
              for filename, findings in results.items():
                  print(f"{filename}:")
                  for finding in findings:
                      print(
                          f"  line {finding.get('line_number')}: "
                          f"{finding.get('type')}"
                      )
              sys.exit(1)
          else:
              print("No secrets detected.")
          PY